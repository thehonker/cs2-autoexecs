// binds.cfg — core gameplay binds

// Quick-switch alias
alias +qsw "lastinv"
alias -qsw "lastinv"

// Movement
bind "w" "+forward"
bind "a" "+left"
bind "s" "+back"
bind "d" "+right"
bind "SPACE" "+jump"
bind "SHIFT" "+duck"
bind "CTRL" "+sprint"
bind "MWHEELUP" "+jump"
bind "MWHEELDOWN" "+jump"

// Mouse
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE3" "player_ping"
bind "MOUSE4" "+qsw"

// Weapons & inventory
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot9"
bind "b" "slot5"
bind "c" "slot10"
bind "f" "slot7"
bind "g" "slot8"
bind "v" "slot6"
bind "x" "slot12"
bind "q" "lastinv"
bind "r" "+reload"
bind "e" "+use"
bind "n" "drop"
bind "m" "buymenu"
bind "." "buyammo2"

// Communication & menus
bind "y" "messagemode"
bind "`" "toggleconsole"
bind "," "teammenu"
bind "TAB" "+showscores"

// Function keys
bind "F3" "switchhands"
bind "F4" "autobuy"
bind "F11" "clutch_mode_toggle"
bind "F14" "+lookatweapon"
bind "F16" "+voicerecord"
